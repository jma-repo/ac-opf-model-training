# Single source of truth for the approximate Alberta open-data grid model.
# NOTE: this model only APPROXIMATES the Alberta system. It is NOT AESO's grid.
project:
  name: alberta-open-grid
  seed: 20261126
  data_dir: data
  raw_dir: data/raw
  interim_dir: data/interim
  output_dir: outputs

region:
  # Alberta bounding box (WGS84 / NAD83 lon-lat): W, S, E, N
  bbox: [-120.01, 48.99, -109.99, 60.01]
  # Overpass is queried in tiles of this size (degrees) to respect limits
  tile_deg: [1.25, 1.375]
  crs_geographic: "EPSG:4269"
  crs_projected: "EPSG:3400"   # NAD83 / Alberta 10-TM (Forest), metres

sources:
  goa_powerlines:
    url: "https://geospatial.alberta.ca/titan/rest/services/utility/access_utility/MapServer/15/query"
    page_size: 1000
    licence: "Open Government Licence - Alberta"
  osm:
    overpass_endpoints:
      # overpass-api.de resets TLS through this environment's egress at
      # collection time; the kumi mirror serves the same OSM data.
      - "https://overpass.kumi.systems/api/interpreter"
      - "https://overpass-api.de/api/interpreter"
    geofabrik_pbf: "https://download.geofabrik.de/north-america/canada/alberta-latest.osm.pbf"
    pause_s: 15          # pause between Overpass tile queries
    rate_limit_wait_s: [60, 120, 240, 480]   # backoff on HTTP 429
    timeout_s: 300
    power_tags: [line, minor_line, cable, substation, plant, generator]
    licence: "ODbL 1.0 (c) OpenStreetMap contributors"
  aeso:
    base_url: "https://apimgw.aeso.ca/public"
    key_env: AESO_API_KEY      # header API-KEY; value never logged
    key_header: API-KEY
    endpoints:
      assetlist: "/assetlist-api/v1/assetlist"
      metered_volume: "/meteredvolume-api/v1/meteredvolume/details"
      ail: "/actualforecast-api/v1/load/albertaInternalLoad"
      gen_capacity: "/aiesgencapacity-api/v1/AIESGenCapacity"   # endpoint supplied by user
    # hourly capacity by fuel / sub-fuel type (MC, AC, outages); not per unit
    gen_capacity_start: "2024-01-01"
    gen_capacity_end: "2025-12-31"
    ail_start: "2023-01-01"
    ail_end: "2025-12-31"
    # all assets: max 16 days per call. 2025-01 returned empty at time of
    # collection, so 2024 winter + summer windows are used.
    metered_volume_windows:
      - ["2024-01-15", "2024-01-30"]
      - ["2024-07-15", "2024-07-30"]
  aeso_files:   # from www.aeso.ca Data Requests page
    base_url: "https://www.aeso.ca"
    files:
      planning_area_load_2023: "/assets/Uploads/data-requests/Planning-Area-Load/Planning-Area-Load-Hourly-2023.zip"
      planning_area_load_2024: "/assets/Uploads/data-requests/Planning-Area-Load/Planning-Area-Load-Hourly-2024.zip"
      planning_area_load_2025: "/assets/Uploads/data-requests/Planning-Area-Load/Planning-Area-Load-Hourly-2025.zip"
      planning_area_boundaries: "/assets/Uploads/AESO-Planning-Areas-2020-06-23.zip"
      planning_regions_pdf: "/assets/Uploads/Planning-Regions.pdf"
  coders:
    base_url: "https://api.sesit.ca"   # HTTPS only: key is a URL query param
    key_env: CODERS_API_KEY            # optional source; skipped if unset
    # table names are confirmed from /tables at first run before use
    tables: [generators, substations, transmission_lines, nodes, junctions,
             interjurisdictional_interties, transmission_generic, storage, data_glossary]
    filters:
      generators: {province: AB}
      substations: {province: AB}
      transmission_lines: {province: AB}
      nodes: {province: AB}
      junctions: {province: AB}
      storage: {province: AB}
  arxiv_dataset:
    arxiv_id: "2504.07870"

topology:
  min_kv: 69
  # nominal kV -> voltage class (base kV). Alberta uses 69/72, 138/144, 240, 500.
  kv_class_map: {69: 69, 72: 69, 115: 138, 138: 138, 144: 138, 230: 240, 240: 240, 260: 240, 500: 500}
  # GoA geometry matching (CODERS branch endpoints -> path on stitched GoA network)
  stitch_tol_m: 25          # GoA polyline endpoints within this distance are joined
  substation_star_m: 500    # substation joined to all GoA vertices within this radius
  substation_snap_m: 1500   # else to the single nearest vertex within this distance
  match_ratio: [0.75, 1.35] # accepted GoA path length / CODERS route length
  detour_ratio: [1.0, 1.6]  # else accepted GoA path length / crow-fly distance
  length_flag_ratio: [0.5, 2.0]  # CODERS length vs GoA path outside this -> flagged
  # OSM conflation (used once the OSM extract is available)
  osm_match_buffer_m: 50
  osm_match_min_overlap: 0.6
  # HVDC links absent from CODERS; endpoints & ratings from public project
  # descriptions (AltaLink WATL, ATCO EATL) -> flagged synthetic:config_hvdc
  hvdc:
    - {name: WATL, from_node: AB_330P_DSS, to_node: AB_102S_DSS, p_max_mw: 1000}
    - {name: EATL, from_node: AB_2029S_TSS, to_node: AB_2075S_DSS, p_max_mw: 1000}
  # interties as boundary buses; limits are illustrative, configurable
  boundary:
    BC:  {nodes: [AB_ABBC01_IPT, AB_ABBC02_IPT, AB_ABBC03_IPT, AB_ABBC04_IPT], import_max_mw: 800, export_max_mw: 800}
    SK:  {nodes: [AB_ABSK01_IPT], import_max_mw: 150, export_max_mw: 150}
    MATL: {nodes: [AB_ABUS01_INT], import_max_mw: 300, export_max_mw: 300}

opf:
  vmin_pu: 0.95
  vmax_pu: 1.05
  base_mva: 100
