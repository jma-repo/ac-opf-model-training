# Single source of truth for the approximate Alberta open-data grid model.
# NOTE: this model only APPROXIMATES the Alberta system. It is NOT AESO's grid.
project:
  name: alberta-open-grid
  seed: 20261126
  data_dir: data
  raw_dir: data/raw
  interim_dir: data/interim
  output_dir: outputs

region:
  # Alberta bounding box (WGS84 / NAD83 lon-lat): W, S, E, N
  bbox: [-120.01, 48.99, -109.99, 60.01]
  # Overpass is queried in tiles of this size (degrees) to respect limits
  tile_deg: [1.25, 1.375]
  crs_geographic: "EPSG:4269"
  crs_projected: "EPSG:3400"   # NAD83 / Alberta 10-TM (Forest), metres

sources:
  goa_powerlines:
    url: "https://geospatial.alberta.ca/titan/rest/services/utility/access_utility/MapServer/15/query"
    page_size: 1000
    licence: "Open Government Licence - Alberta"
  osm:
    overpass_endpoints:
      # overpass-api.de resets TLS through this environment's egress at
      # collection time; the kumi mirror serves the same OSM data.
      - "https://overpass.kumi.systems/api/interpreter"
      - "https://overpass-api.de/api/interpreter"
    geofabrik_pbf: "https://download.geofabrik.de/north-america/canada/alberta-latest.osm.pbf"
    pause_s: 15          # pause between Overpass tile queries
    rate_limit_wait_s: [60, 120, 240, 480]   # backoff on HTTP 429
    timeout_s: 300
    power_tags: [line, minor_line, cable, substation, plant, generator]
    licence: "ODbL 1.0 (c) OpenStreetMap contributors"
  aeso:
    base_url: "https://apimgw.aeso.ca/public"
    key_env: AESO_API_KEY      # header API-KEY; value never logged
    key_header: API-KEY
    endpoints:
      assetlist: "/assetlist-api/v1/assetlist"
      metered_volume: "/meteredvolume-api/v1/meteredvolume/details"
      ail: "/actualforecast-api/v1/load/albertaInternalLoad"
      gen_capacity: "/aiesgencapacity-api/v1/AIESGenCapacity"   # endpoint supplied by user
    # hourly capacity by fuel / sub-fuel type (MC, AC, outages); not per unit
    gen_capacity_start: "2024-01-01"
    gen_capacity_end: "2025-12-31"
    ail_start: "2023-01-01"
    ail_end: "2025-12-31"
    # all assets: max 16 days per call. 2025-01 returned empty at time of
    # collection, so 2024 winter + summer windows are used.
    metered_volume_windows:
      - ["2024-01-15", "2024-01-30"]
      - ["2024-07-15", "2024-07-30"]
  aeso_files:   # from www.aeso.ca Data Requests page
    base_url: "https://www.aeso.ca"
    files:
      planning_area_load_2023: "/assets/Uploads/data-requests/Planning-Area-Load/Planning-Area-Load-Hourly-2023.zip"
      planning_area_load_2024: "/assets/Uploads/data-requests/Planning-Area-Load/Planning-Area-Load-Hourly-2024.zip"
      planning_area_load_2025: "/assets/Uploads/data-requests/Planning-Area-Load/Planning-Area-Load-Hourly-2025.zip"
      planning_area_boundaries: "/assets/Uploads/AESO-Planning-Areas-2020-06-23.zip"
      planning_regions_pdf: "/assets/Uploads/Planning-Regions.pdf"
  coders:
    base_url: "https://api.sesit.ca"   # HTTPS only: key is a URL query param
    key_env: CODERS_API_KEY            # optional source; skipped if unset
    # table names are confirmed from /tables at first run before use
    tables: [generators, substations, transmission_lines, nodes, junctions,
             interjurisdictional_interties, transmission_generic, storage, data_glossary]
    filters:
      generators: {province: AB}
      substations: {province: AB}
      transmission_lines: {province: AB}
      nodes: {province: AB}
      junctions: {province: AB}
      storage: {province: AB}
  arxiv_dataset:
    arxiv_id: "2504.07870"

topology:
  min_kv: 69
  # nominal kV -> voltage class (base kV). Alberta uses 69/72, 138/144, 240, 500.
  kv_class_map: {69: 69, 72: 69, 115: 138, 138: 138, 144: 138, 230: 240, 240: 240, 260: 240, 500: 500}
  # GoA geometry matching (CODERS branch endpoints -> path on stitched GoA network)
  stitch_tol_m: 25          # GoA polyline endpoints within this distance are joined
  substation_star_m: 500    # substation joined to all GoA vertices within this radius
  substation_snap_m: 1500   # else to the single nearest vertex within this distance
  match_ratio: [0.75, 1.35] # accepted GoA path length / CODERS route length
  detour_ratio: [1.0, 1.6]  # else accepted GoA path length / crow-fly distance
  length_flag_ratio: [0.5, 2.0]  # CODERS length vs GoA path outside this -> flagged
  # OSM conflation (used once the OSM extract is available)
  osm_match_buffer_m: 50
  osm_match_min_overlap: 0.6
  # HVDC links absent from CODERS; endpoints & ratings from public project
  # descriptions (AltaLink WATL, ATCO EATL) -> flagged synthetic:config_hvdc
  hvdc:
    - {name: WATL, from_node: AB_330P_DSS, to_node: AB_102S_DSS, p_max_mw: 1000}
    - {name: EATL, from_node: AB_2029S_TSS, to_node: AB_2075S_DSS, p_max_mw: 1000}
  # HVDC is modelled as a fixed schedule (load at sending end, generator at
  # receiving end minus losses); pandapower's dcline OPF model allowed
  # unphysical reverse flow/losses in testing. Varied in scenarios (Phase 5).
  hvdc_schedule_mw: {WATL: 600, EATL: 600}   # + = north (from) -> south (to)
  hvdc_loss_percent: 1.5
  # interties as boundary buses; limits are illustrative, configurable
  boundary:
    BC:  {nodes: [AB_ABBC01_IPT, AB_ABBC02_IPT, AB_ABBC03_IPT, AB_ABBC04_IPT], import_max_mw: 800, export_max_mw: 800}
    SK:  {nodes: [AB_ABSK01_IPT], import_max_mw: 150, export_max_mw: 150}
    MATL: {nodes: [AB_ABUS01_INT], import_max_mw: 300, export_max_mw: 300}


params:
  snapshot_mpt: "2024-01-25 18:00"   # base case hour (winter evening; metered data available)
  # AESO planning-area grid-served load (excl. behind-the-fence), consistent with
  # net-to-grid metered generation. (ActLoad incl. BTF was used before calibration.)
  load_column: Load
  load_power_factor: 0.95            # synthetic:fixed_pf
  # Line R and B: textbook typical values by voltage class. X comes from CODERS.
  # Sources/assumptions: Kundur, Power System Stability and Control, Table 6.1
  # (230 kV: r 0.050, x 0.488 ohm/km, b 3.371 uS/km; 500 kV: r 0.028, x 0.325,
  # b 5.2); 69/138 kV: typical single 266/477 kcmil ACSR (Glover, Sarma &
  # Overbye, Power System Analysis and Design, App. A). x_ohm_per_km only used
  # as a fallback/sanity reference.
  line_defaults:
    69:  {r_ohm_per_km: 0.210, x_ohm_per_km: 0.45, b_us_per_km: 3.6}
    138: {r_ohm_per_km: 0.120, x_ohm_per_km: 0.48, b_us_per_km: 3.4}
    240: {r_ohm_per_km: 0.050, x_ohm_per_km: 0.49, b_us_per_km: 3.4}
    500: {r_ohm_per_km: 0.028, x_ohm_per_km: 0.33, b_us_per_km: 5.2}
  # R derived from open X using the X/R ratio implied by the table above
  min_x_ohm: 0.01                    # floor for zero/near-zero reactances
  # Transformers: typical values by voltage pair (synthetic)
  transformer_defaults:
    "500/240": {sn_mva: 1200, vk_percent: 14.0, vkr_percent: 0.25}
    "240/138": {sn_mva: 400,  vk_percent: 12.0, vkr_percent: 0.30}
    "240/69":  {sn_mva: 150,  vk_percent: 10.0, vkr_percent: 0.40}
    "138/69":  {sn_mva: 100,  vk_percent: 9.0,  vkr_percent: 0.50}
    "500/138": {sn_mva: 600,  vk_percent: 13.0, vkr_percent: 0.30}
  # rating = max(default, sizing_factor * min(sum of HV-side, LV-side line ratings))
  transformer_sizing_factor: 0.5
  # Generators. Cost curves are ILLUSTRATIVE ONLY (CAD/MWh), by fuel type.
  fuels:
    wind:        {c1: 0.0,  c2: 0.0,   q_max_frac: 0.33, q_min_frac: -0.33}
    solar:       {c1: 0.0,  c2: 0.0,   q_max_frac: 0.33, q_min_frac: -0.33}
    hydro:       {c1: 8.0,  c2: 0.002, q_max_frac: 0.5,  q_min_frac: -0.3}
    biomass:     {c1: 25.0, c2: 0.005, q_max_frac: 0.5,  q_min_frac: -0.3}
    gas_cogen:   {c1: 30.0, c2: 0.004, q_max_frac: 0.5,  q_min_frac: -0.3}
    gas_cc:      {c1: 40.0, c2: 0.004, q_max_frac: 0.5,  q_min_frac: -0.3}
    gas_steam:   {c1: 55.0, c2: 0.005, q_max_frac: 0.5,  q_min_frac: -0.3}
    gas_peaker:  {c1: 90.0, c2: 0.010, q_max_frac: 0.5,  q_min_frac: -0.3}
  coders_fuel_map: {wind_ons: wind, solar_PV: solar, hydro_run: hydro, hydro_daily: hydro,
                    biomass: biomass, NG_CG: gas_cogen, NG_CC: gas_cc, NG_SC: gas_peaker}
  arxiv_fuel_override: {"Gas Fired Steam": gas_steam}   # converted coal units mis-typed NG_CC
  p_min_frac: 0.0          # synthetic: no unit commitment in OPF base case
  intertie_schedule_mw: {BC: 0, SK: 0, MATL: 0}   # net import (+) fixed in base case

opf:
  vmin_pu: 0.95
  vmax_pu: 1.05
  base_mva: 100
  # documented relaxation hierarchy, applied in order only if infeasible
  relaxations:
    - {level: 1, name: line_ratings_x1.2, rating_factor: 1.2}
    - {level: 2, name: voltage_0.90-1.10, vmin_pu: 0.90, vmax_pu: 1.10}
    - {level: 3, name: reactive_support, svc_mvar: 200, svc_kv_min: 240}
    - {level: 4, name: load_shedding_slack, voll: 5000}

scenarios:
  run_name: s1250c   # calibrated structure (grid-served load, metered cogen/hydro/biomass)
  n: 1250
  seed: 20261127
  n_processes: 4
  hours_year: 2024                 # real hours: planning-area load + metered wind/solar
  local_load_noise: 0.05           # synthetic: per-bus multiplicative U(-σ, σ)
  families:                        # fraction of scenarios per family
    base_hourly: 0.40              # real hour, all elements in service
    n1_line: 0.25                  # + one random non-bridge AC branch out
    n1_gen: 0.15                   # + one random unit out (not the slack unit)
    large_load: 0.20               # + data-centre load at a candidate bus
  large_load:
    sizes_mw: [100, 300, 500]
    candidate_kv: [138, 240]
    power_factor: 0.98
  hvdc_schedule_range_mw: [0, 1000]     # north->south, per link, uniform (synthetic)
  intertie_range: true                  # uniform in [-export, import] per neighbour (synthetic)
  relax_in_scenarios: true              # run the relaxation hierarchy and record the level
  export_pyg: true                      # write OPFData .pyg.json per scenario

calibration:
  # CODERS unit -> AESO metered asset where the code pattern fails (facility-level metering);
  # output split across a facility's units in proportion to capacity (derived:facility_share)
  aeso_asset_overrides:
    BOW1: [BRR, BSP, CSC01, CSC02, GHT01, GHT02, GHT03, GHT04, HSH01, HSH02, HSH03, HSH04, ILK,
           KNK01, KNK02, KNK03, PCT, RND01, RND02, SPR01, SPR02, TSS]
    BIG: [BIG01, BIG02]
    BRA: [BRA01, BRA02]
    DKSN: [DKSN01, DKSN02, DKSN03]
    OMRH: [OMRH01, OMRH02]
    CRG1: [CRG01]
    NX02: [NX21]
    RB5: [RBL05]
    VVW2: [VVW02]
  # fuels whose hourly output is fixed to AESO metered output (not price-dispatched):
  # cogeneration follows industrial process load, hydro follows water, biomass fuel supply
  fixed_output_fuels: [gas_cogen, hydro, biomass]
  dispatched_fuels: [gas_cc, gas_steam, gas_peaker]
  # inverse optimisation: c1_unit = a_fuel + b_fuel * (1 - CF_unit_2024), fitted on DC-OPF
  n_fit_hours: 24
  n_val_hours: 12
  hour_windows: [["2024-01-15", "2024-01-30"], ["2024-07-15", "2024-07-30"]]   # all-asset metered windows (interchange known)
  seed: 7
  init: {gas_cc: [40, 20], gas_steam: [55, 20], gas_peaker: [90, 30]}
  bounds: [[10, 200], [0, 150]]
  c2: 0.004
  max_evals: 160
  simplex_step: 15

finetune:
  scenario_run: s1250c          # calibrated scenarios
  seed: 42
  n_test: 150
  n_val: 100
  rounds: [10, 100, 1000]
  epochs: {"10": 10, "100": 10, default: 4}   # CPU budget: fewer epochs for the 1000 round
  batch_size: 8
  lr: 1.0e-4
  infeas_prob: 0.2              # share of feasible graphs perturbed by SyntheticMixedDataset
  threads: 4
  refine:              # Phase 6b: angle-weighted continuation of FT-1000
    n_train: 1000
    theta_weight: 20.0
    lr: 5.0e-5
    epochs: 4

siting:                 # Phase 7: data-centre siting screen
  snapshots:
    winter_peak: "2024-01-25 18:00"
    summer_peak: auto_max_load_jul      # highest grid-served load hour in the July metered window
  candidate_kv: [138, 240]
  sizes_mw: [100, 300, 500]
  pf: 0.98
  checkpoint: gridsfm_alberta_n1000_refined.pt
  verify:               # solver checks per snapshot x size
    top: 5              # most attractive predicted-feasible sites (lowest cost increase)
    borderline: 5       # p_feasible closest to 0.5
    worst: 3            # lowest p_feasible
    random: 3
    seed: 11
